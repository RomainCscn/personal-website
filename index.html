<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romain Cascino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111;
      background: #fff;
      padding: 0 24px;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
    }

    main {
      max-width: 400px;
      width: 100%;
      padding: 120px 0;
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .headline {
      color: #666;
      font-size: 15px;
      margin-top: 6px;
    }

    .experience {
      margin-top: 48px;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 16px 0;
      align-items: baseline;
    }

    .company {
      font-size: 15px;
      font-weight: 500;
    }

    .company a {
      color: inherit;
      text-decoration: none;
    }

    .company a:hover {
      text-decoration: underline;
    }

    .date-start,
    .date-sep,
    .date-end {
      font-size: 14px;
      color: #666;
      font-variant-numeric: tabular-nums;
    }

    .date-sep {
      padding: 0 6px;
    }

    .date-end {
      min-width: 32px;
    }

    .links {
      margin-top: 48px;
      display: flex;
      gap: 20px;
      font-size: 14px;
    }

    .links a {
      color: #666;
      text-decoration: none;
    }

    .links a:hover {
      color: #111;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #eee;
        background: #111;
      }

      .headline,
      .date-start,
      .date-sep,
      .date-end,
      .links a {
        color: #888;
      }

      .links a:hover {
        color: #eee;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Romain Cascino</h1>
    <p class="headline">Product Engineer</p>

    <section class="experience">
      <span class="company"><a href="https://linear.app">Linear</a></span>
      <span class="date-start">2023</span>
      <span class="date-sep">&ndash;</span>
      <span class="date-end">Now</span>

      <span class="company"><a href="https://www.swile.co">Swile</a></span>
      <span class="date-start">2021</span>
      <span class="date-sep">&ndash;</span>
      <span class="date-end">2023</span>

      <span class="company"><a href="https://www.thefork.com">TheFork</a></span>
      <span class="date-start">2019</span>
      <span class="date-sep">&ndash;</span>
      <span class="date-end">2020</span>

      <span class="company"><a href="https://www.myscript.com">MyScript</a></span>
      <span class="date-start">2017</span>
      <span class="date-sep">&ndash;</span>
      <span class="date-end">2018</span>
    </section>

    <nav class="links">
      <a href="https://github.com/RomainCscn">GitHub</a>
      <a href="https://x.com/RomainCascino">Twitter</a>
      <a href="https://www.linkedin.com/in/romaincascino">LinkedIn</a>
      <a href="mailto:contact@romaincascino.com">Email</a>
    </nav>
  </main>
</body>
</html>
